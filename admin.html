<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPL Admin Payouts Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDKs for single-file browser support -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #0B0E14; color: #FFFFFF; font-family: system-ui, sans-serif; }
    .neon-border { border: 1px solid rgba(0, 255, 135, 0.25); }
  </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto min-h-screen">

  <!-- Header -->
  <header class="flex justify-between items-center mb-6 pb-4 border-b border-gray-800">
    <div>
      <h1 class="text-2xl font-black tracking-wider text-green-400">TPL ADMIN CONSOLE</h1>
      <p class="text-xs text-gray-400">Manage Real-time UPI Withdrawals & Users</p>
    </div>
    <span class="px-3 py-1 text-xs rounded-full bg-green-950 text-green-400 border border-green-700 font-semibold">
      ⚡ Live Sync Active
    </span>
  </header>

  <!-- Metric Cards -->
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6">
    <div class="bg-gray-900 p-4 rounded-xl neon-border">
      <div class="text-xs text-gray-400">Pending Requests</div>
      <div id="pendingCount" class="text-2xl font-black text-amber-400 mt-1">0</div>
    </div>
    <div class="bg-gray-900 p-4 rounded-xl neon-border">
      <div class="text-xs text-gray-400">Pending Payout Total</div>
      <div id="pendingAmount" class="text-2xl font-black text-green-400 mt-1">₹0.00</div>
    </div>
    <div class="bg-gray-900 p-4 rounded-xl neon-border col-span-2 sm:col-span-1">
      <div class="text-xs text-gray-400">Processed Today</div>
      <div id="completedCount" class="text-2xl font-black text-blue-400 mt-1">0</div>
    </div>
  </div>

  <!-- Withdrawal Queue Section -->
  <section>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold tracking-wide">Payout Requests Queue</h2>
      <button onclick="fetchWithdrawals()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700 text-gray-300">
        🔄 Refresh
      </button>
    </div>

    <!-- Request Cards Container -->
    <div id="withdrawalsList" class="space-y-3">
      <div class="text-center py-10 text-gray-500 text-sm">Connecting to Firebase...</div>
    </div>
  </section>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-green-500 text-black px-4 py-2 rounded-lg text-sm font-bold shadow-lg hidden">
    Copied to clipboard!
  </div>

  <script>
    // -----------------------------------------------------------
    // 1. YOUR REAL FIREBASE CONFIGURATION
    // -----------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCMFViBcyJVEawOZASTQ9qr2zDwIqhqKn8",
      authDomain: "tpl-5bd9d.firebaseapp.com",
      projectId: "tpl-5bd9d",
      storageBucket: "tpl-5bd9d.firebasestorage.app",
      messagingSenderId: "940679131159",
      appId: "1:940679131159:web:8b3de2fbf61b57615a2c52",
      measurementId: "G-KRP2LPFGQ4"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // -----------------------------------------------------------
    // 2. REAL-TIME DATA LISTENER
    // -----------------------------------------------------------
    function fetchWithdrawals() {
      db.collection('withdrawals')
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          const list = document.getElementById('withdrawalsList');
          list.innerHTML = '';

          let pCount = 0;
          let pAmt = 0;
          let cCount = 0;

          if (snapshot.empty) {
            list.innerHTML = `<div class="p-8 text-center text-gray-500 bg-gray-900 rounded-xl border border-gray-800 text-sm">
              No withdrawal requests in queue yet.
            </div>`;
            document.getElementById('pendingCount').innerText = "0";
            document.getElementById('pendingAmount').innerText = "₹0.00";
            document.getElementById('completedCount').innerText = "0";
            return;
          }

          snapshot.forEach((doc) => {
            const data = doc.data();
            const id = doc.id;
            const isPending = data.status === 'Pending';

            if (isPending) {
              pCount++;
              pAmt += (data.amount || 0);
            } else if (data.status === 'Completed') {
              cCount++;
            }

            const card = document.createElement('div');
            card.className = `p-4 rounded-xl border ${isPending ? 'bg-gray-900 border-gray-800' : 'bg-gray-950 border-gray-900 opacity-70'} flex flex-col sm:flex-row sm:items-center justify-between gap-4`;

            card.innerHTML = `
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-base text-white">${data.userName || 'Player'}</span>
                  <span class="text-xs px-2 py-0.5 rounded ${isPending ? 'bg-amber-950 text-amber-400 border border-amber-800' : 'bg-green-950 text-green-400'}">${data.status}</span>
                  <span class="text-xs text-gray-500">• ${data.type}</span>
                </div>
                <div class="flex items-center gap-2 text-sm text-gray-300">
                  <span>UPI: <b class="text-white">${data.upiId}</b></span>
                  <button onclick="copyUpi('${data.upiId}')" class="text-xs bg-gray-800 hover:bg-gray-700 px-2 py-0.5 rounded text-green-400 border border-gray-700">
                    📋 Copy
                  </button>
                </div>
                <div class="text-xs text-gray-500">${data.userEmail || ''}</div>
              </div>

              <div class="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-gray-800">
                <div class="text-right">
                  <div class="text-xl font-black text-green-400">₹${(data.amount || 0).toFixed(2)}</div>
                </div>

                ${isPending ? `
                  <div class="flex gap-2">
                    <button onclick="markAsPaid('${id}')" class="px-3 py-1.5 bg-green-400 hover:bg-green-300 text-black font-black text-xs rounded-lg transition">
                      Mark Paid
                    </button>
                    <button onclick="rejectRequest('${id}', '${data.uid}', ${data.amount}, '${data.type}')" class="px-3 py-1.5 bg-red-950 hover:bg-red-900 text-red-400 text-xs rounded-lg border border-red-800">
                      Reject & Refund
                    </button>
                  </div>
                ` : `
                  <span class="text-xs text-gray-500 font-semibold">Resolved</span>
                `}
              </div>
            `;
            list.appendChild(card);
          });

          document.getElementById('pendingCount').innerText = pCount;
          document.getElementById('pendingAmount').innerText = '₹' + pAmt.toFixed(2);
          document.getElementById('completedCount').innerText = cCount;
        }, (error) => {
          document.getElementById('withdrawalsList').innerHTML = `
            <div class="p-6 bg-red-950 text-red-300 rounded-xl text-xs">
              <b>Firestore connection error:</b> ${error.message}
            </div>`;
        });
    }

    // -----------------------------------------------------------
    // 3. ADMIN ACTIONS
    // -----------------------------------------------------------
    async function markAsPaid(docId) {
      if (!confirm("Are you sure you have paid via UPI and want to mark this completed?")) return;
      try {
        await db.collection('withdrawals').doc(docId).update({
          status: 'Completed',
          paidAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast("Marked as Completed!");
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    async function rejectRequest(docId, uid, amount, type) {
      const reason = prompt("Enter reason for rejection (e.g. Invalid UPI ID):");
      if (reason === null) return;

      try {
        const fieldToRefund = type === 'Task Cash' ? 'taskCash' : 'referCash';
        await db.collection('users').doc(uid).update({
          [fieldToRefund]: firebase.firestore.FieldValue.increment(amount)
        });

        await db.collection('withdrawals').doc(docId).update({
          status: 'Rejected',
          rejectionReason: reason,
          rejectedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showToast("Request rejected & funds refunded!");
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    function copyUpi(upi) {
      navigator.clipboard.writeText(upi).then(() => showToast("UPI ID Copied!"));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2200);
    }

    // Initialize on load
    window.onload = fetchWithdrawals;
  </script>
</body>
    </html>
