name: tpl_app
description: "TPL Pro Rewards App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_remote_config: ^5.1.3

  # Ads, Web & Sharing
  unity_ads_plugin: ^0.3.12
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  http: ^1.2.2
  path_provider: ^2.1.4
  open_filex: ^4.7.0
  webview_flutter: ^4.10.0

  # Sound Effects (Spin & Win)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration (TPL Golden Logo)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#080B10"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    
