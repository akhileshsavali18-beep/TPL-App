name: tpl_app
description: "TPL Pro Rewards App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Packages
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_remote_config: ^5.1.3

  # Ads & Web
  unity_ads_plugin: ^0.3.12
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

  # 🔊 Sound Plugin (ಹೊಸದಾಗಿ ಸೇರಿಸಬೇಕಾಗಿರುವುದು)
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 🎵 Assets declaration
  assets:
    - assets/images/
    - assets/sounds/
    
