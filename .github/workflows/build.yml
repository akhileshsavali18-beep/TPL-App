name: Build TPL Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android project files
        run: flutter create . --org com.a28technologies --project-name tpl

      - name: Install dependencies
        run: flutter pub get

      # ಆ್ಯಪ್ ಐಕಾನ್ ಜನರೇಟ್ ಮಾಡುವ ಕಮಾಂಡ್
      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      # ಆ್ಯಪ್ ಹೆಸರನ್ನು ಕ್ಯಾಪಿಟಲ್ TPL ಮಾಡಲು
      - name: Set App Label to TPL
        run: |
          sed -i 's/android:label="tpl"/android:label="TPL"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPL-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
