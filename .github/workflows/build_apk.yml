name: Build TPL Pro APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Scaffolding & Fix Config
        run: |
          mkdir -p temp_backup
          [ -f android/app/src/main/AndroidManifest.xml ] && cp android/app/src/main/AndroidManifest.xml temp_backup/
          [ -f google-services.json ] && cp google-services.json temp_backup/
          [ -f android/app/google-services.json ] && cp android/app/google-services.json temp_backup/

          flutter create . --project-name tpl_app --platforms=android --org com.tplpro.app

          if [ -f temp_backup/AndroidManifest.xml ]; then
            mkdir -p android/app/src/main
            cp temp_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          if [ -f temp_backup/google-services.json ]; then
            cp temp_backup/google-services.json android/app/google-services.json
          fi

          # Set minSdk to 23 and compileSdk to 35 for audioplayers compatibility
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 21/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle || true

          # Google Services Gradle configuration
          sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle || true
          sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle || true

          # Persistent release signing for in-app APK updates.
          # Required GitHub secrets:
          # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
          # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Missing persistent Android signing secrets." >&2
            exit 1
          fi

          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/tpl-release.p12
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../tpl-release.p12
          storeType=PKCS12
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "def flutterVersionCode = localProperties.getProperty('flutter.versionCode')"
          signing = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
          if "def keystoreProperties = new Properties()" not in s:
              s = s.replace(marker, signing + marker, 1)
          if "signingConfigs {" not in s:
              s = s.replace("android {", """android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                      storeType keystoreProperties['storeType'] ?: 'PKCS12'
                  }
              }
          """, 1)
          s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          p.write_text(s)
          PY

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Set build number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=$BUILD_NUMBER --dart-define=APP_BUILD_NUMBER=$BUILD_NUMBER

      - name: Prepare Release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TPL-Pro-Release-APK.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: TPL Pro Build ${{ github.run_number }}
          generate_release_notes: false
          make_latest: true
          files: build/app/outputs/flutter-apk/TPL-Pro-Release-APK.apk

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: TPL-Pro-Release-APK
          path: build/app/outputs/flutter-apk/TPL-Pro-Release-APK.apk
          
